name: Android APK
on:
  push:
    branches: [feature/flutter-supabase]
    paths: ['mobile/**', 'supabase/**', 'tool/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'supabase/**', 'tool/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: attendance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify database permissions and attendance rules
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d attendance_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -h localhost -U postgres -d attendance_test -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h localhost -U postgres -d attendance_test -v ON_ERROR_STOP=1 -f supabase/tests/security.sql
  android:
    runs-on: ubuntu-latest
    needs: database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: bash tool/prepare_android.sh "$RUNNER_TEMP/cham_cong"
      - name: Analyze and test
        working-directory: ${{ runner.temp }}/cham_cong
        run: |
          flutter analyze
          flutter test
      - name: Build test APK
        working-directory: ${{ runner.temp }}/cham_cong
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cham-cong-android-test
          path: ${{ runner.temp }}/cham_cong/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
